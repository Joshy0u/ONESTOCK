<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneStock Dashboard</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-8">

    <header class="flex justify-between items-center mb-8 pb-4 border-b border-slate-800">
        <div class="flex items-center space-x-3">
            <span class="bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-lg">📦 OneStock</span>
            <span class="text-slate-400 text-sm">Inventory Control System</span>
        </div>
        <div class="bg-slate-900 border border-slate-800 px-4 py-2 rounded-full text-sm text-emerald-400 font-medium">
            🟢 Backend Online
        </div>
    </header>

    <main class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold tracking-tight text-white">Products Catalog</h1>
            <span id="product-count" class="text-sm text-slate-400">Loading items...</span>
        </div>

        <div id="product-list" class="space-y-4">
            <div class="text-slate-500 text-center py-8">Fetching data from backend...</div>
        </div>
    </main>

    <script>
        async function loadProducts() {
            const container = document.getElementById('product-list');
            const countLabel = document.getElementById('product-count');

            try {
                // Fetching the complete product list from FastAPI
                const response = await fetch('http://127.0.0.1:8000/products');
                if (!response.ok) throw new Error('Failed to connect to backend');

                const products = await response.json();
                countLabel.innerText = `Total items: ${products.length}`;

                if (products.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-center py-8">No products found in database yet.</p>`;
                    return;
                }

                container.innerHTML = '';
                products.forEach(p => {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-xl flex justify-between items-center shadow-lg hover:border-slate-700 transition">
                            <div>
                                <div class="flex items-center space-x-3 mb-1">
                                    <span class="font-mono text-emerald-400 font-semibold text-sm">SKU: ${p.sku}</span>
                                    <span class="bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md">UOM ID: ${p.uom_id}</span>
                                </div>
                                <h2 class="text-lg font-medium text-white">${p.name}</h2>
                                <p class="text-xs text-slate-400 mt-1">${p.special_notes || 'No notes specified.'}</p>
                            </div>
                            <div class="text-right">
                                <span class="text-xl font-bold text-emerald-400">$${p.list_price ? Number(p.list_price).toFixed(2) : '0.00'}</span>
                                <div class="mt-2">
                                    <span class="bg-emerald-950 text-emerald-400 border border-emerald-800/50 text-xs px-2.5 py-1 rounded-full font-medium">Active</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="bg-red-950/50 border border-red-900 text-red-300 p-4 rounded-xl text-center">Could not connect to FastAPI backend. Make sure Uvicorn is running!</div>`;
                countLabel.innerText = 'Connection Error';
            }
        }

        // Load products immediately when the page opens
        loadProducts();
    </script>

</body>
</html>
