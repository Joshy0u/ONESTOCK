<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneStock Inventory Control System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen overflow-hidden flex">

    <!-- LEFT SIDEBAR -->
    <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="h-16 flex items-center px-6 bg-slate-950 text-white font-bold text-xl tracking-wide border-b border-slate-800">
                📦 OneStock
            </div>

            <nav class="mt-4 px-3 space-y-1">
                <button onclick="switchScreen('overview')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">1. Overview</button>
                <button onclick="switchScreen('inventory')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-emerald-400 bg-emerald-950/40 border border-emerald-900/50 transition text-sm font-medium">2. Inventory</button>
                <button onclick="switchScreen('reorder')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">3. Reorder Alerts</button>
                <button onclick="switchScreen('po')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">4. Purchase Orders & Receiving</button>
                <button onclick="switchScreen('transfers')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">5. Transfers</button>
                <button onclick="switchScreen('sales')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">6. Store Sales & Forecast</button>
                <button onclick="switchScreen('suppliers')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">7. Suppliers</button>
                <button onclick="switchScreen('finance')" class="w-full flex items-center px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition text-sm font-medium">8. Finance</button>
            </nav>
        </div>
        <div class="p-4 text-xs text-slate-500 border-t border-slate-800">
            Supply Chain Demo v3.2
        </div>
    </aside>

    <!-- MAIN APP AREA -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- TOP NAV BAR -->
        <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shadow-sm z-10">
            <div class="flex items-center space-x-3">
                <span class="text-sm font-medium text-slate-400">Current View:</span>
                <span id="screen-title" class="text-white font-semibold text-base">Inventory Management</span>
            </div>

            <!-- Controls -->
            <div class="flex items-center space-x-4">
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-0.5">Persona / Role</label>
                    <select id="user-switcher" class="text-xs bg-slate-950 border border-slate-700 text-slate-200 rounded-md px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        <option value="hq">HQ / Executive</option>
                        <option value="purchasing">Purchasing Manager</option>
                        <option value="dc">DC Manager</option>
                        <option value="store" selected>Store Manager</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] uppercase tracking-wider text-slate-500 font-semibold mb-0.5">Location Filter</label>
                    <select id="location-picker" class="text-xs bg-slate-950 border border-slate-700 text-slate-200 rounded-md px-3 py-1.5 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        <option value="all">All Locations</option>
                        <option value="store-downtown" selected>Store Downtown</option>
                        <option value="central-dc">Central DC</option>
                    </select>
                </div>
            </div>
        </header>

        <!-- DYNAMIC CONTENT CONTAINER -->
        <main class="flex-1 overflow-y-auto p-8">
            <div class="max-w-6xl mx-auto">
                <div class="flex justify-between items-center mb-6">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight text-white">Inventory Management</h1>
                        <p class="text-xs text-slate-400 mt-1">Live data fetched directly from FastAPI backend tables.</p>
                    </div>
                    <span id="product-count" class="text-xs bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-lg text-slate-300">Loading items...</span>
                </div>

                <!-- Product Data Feed Container -->
                <div id="product-list" class="space-y-3">
                    <div class="text-slate-500 text-center py-12">Connecting to FastAPI backend...</div>
                </div>
            </div>
        </main>
    </div>

    <script>
        async function loadProducts() {
            const container = document.getElementById('product-list');
            const countLabel = document.getElementById('product-count');

            try {
                const response = await fetch('http://127.0.0.1:8000/products');
                if (!response.ok) throw new Error('Failed to connect to backend');

                const products = await response.json();
                countLabel.innerText = `${products.length} Items Loaded`;

                if (products.length === 0) {
                    container.innerHTML = `<p class="text-slate-500 text-center py-8">No products found in database.</p>`;
                    return;
                }

                container.innerHTML = '';
                products.forEach(p => {
                    container.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl flex justify-between items-center hover:border-slate-700 transition">
                            <div class="flex items-center space-x-4">
                                <div class="bg-slate-950 border border-slate-800 px-3 py-2 rounded-lg font-mono text-xs text-emerald-400 font-semibold">
                                    ${p.sku}
                                </div>
                                <div>
                                    <h2 class="text-sm font-medium text-white">${p.name}</h2>
                                    <p class="text-xs text-slate-400">${p.special_notes || 'Standard inventory item'}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-6 text-right">
                                <div>
                                    <span class="text-xs text-slate-500 block">List Price</span>
                                    <span class="text-sm font-bold text-emerald-400">$${p.list_price ? Number(p.list_price).toFixed(2) : '0.00'}</span>
                                </div>
                                <span class="bg-emerald-950/60 text-emerald-400 border border-emerald-800/50 text-[11px] px-2.5 py-1 rounded-full font-medium">In Stock</span>
                            </div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error(error);
                container.innerHTML = `<div class="bg-red-950/40 border border-red-900 text-red-300 p-4 rounded-xl text-center text-sm">Could not connect to FastAPI backend. Ensure your Uvicorn server is running!</div>`;
                countLabel.innerText = 'Connection Error';
            }
        }

        function switchScreen(screenName) {
            document.getElementById('screen-title').innerText = screenName.charAt(0).toUpperCase() + screenName.slice(1);
        }

        // Initialize data fetch on page load
        loadProducts();
    </script>
</body>
</html>
